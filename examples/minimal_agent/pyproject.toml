[project]
name = "minimal-agent"
version = "0.1.0"
description = "Minimal standalone ReAct agent extracted from Lara's agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygent-ai==0.3.20",
]

[project.scripts]
minimal-agent = "minimal_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimal_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
