<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc">
  <title id="title">Agent 框架公平资源基准</title>
  <desc id="desc">将 Agent 循环、durable execution runtime 与 service runtime 分赛道比较，展示 200 和 1000 Agent 并发下的排名、时延、CPU、内存及写入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#10263a"/></linearGradient>
    <style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#eaf4ff}.title{font-size:42px;font-weight:700}.sub{font-size:20px;fill:#a9c0d4}.h{font-size:27px;font-weight:700}.label{font-size:20px}.small{font-size:16px;fill:#a9c0d4}.num{font-size:19px;font-weight:700;text-anchor:end}.rank{font-size:23px;font-weight:700;text-anchor:middle}.card{fill:#102a40;stroke:#244c68;stroke-width:1.5}.winner{fill:#12394a;stroke:#24c9b2;stroke-width:2}.warn{fill:#3b2930;stroke:#e37b86;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="64" y="76" class="title">Agent 框架公平资源基准</text>
  <text x="64" y="112" class="sub">循环 / durable execution / service runtime 分赛道 · Windows · 统一 mock · 每请求 3 次工具 + 1 次终答</text>
  <g transform="translate(64 154)">
    <rect width="1472" height="144" rx="20" class="card"/>
    <text x="28" y="42" class="h">公平口径</text>
    <text x="28" y="78" class="label">① 循环榜只比较非持久化 Agent loop；不把 runtime-disabled / preferred 混入总排名</text>
    <text x="28" y="110" class="label">② runtime 必须真实启动并验证 [1,2,3] 工具序列；服务、worker、SQLite 与外部引擎全部计费</text>
  </g>
  <g transform="translate(64 330)">
    <text x="0" y="0" class="h">运行时赛道 · 200 Agent 并发</text>
    <text x="940" y="0" class="small">单位：秒 / MB；综合分为本赛道五项等权排名分</text>
    <g transform="translate(0 24)"><rect width="1472" height="76" rx="15" class="winner"/><circle cx="34" cy="38" r="21" fill="#1a6c70"/><text x="34" y="46" class="rank">1</text><text x="74" y="34" class="label">Pygent 0.3.10 preferred</text><text x="74" y="58" class="small">事件 journal + SQLite</text><text x="770" y="46" class="num">运行 3.828</text><text x="950" y="46" class="num">P95 3.758</text><text x="1115" y="46" class="num">CPU 4.906</text><text x="1282" y="46" class="num">RSS 102.2</text><text x="1438" y="46" class="num">写入 96.0</text></g>
    <g transform="translate(0 112)"><rect width="1472" height="76" rx="15" class="card"/><circle cx="34" cy="38" r="21" fill="#244c68"/><text x="34" y="46" class="rank">2</text><text x="74" y="34" class="label">LangGraph 1.2.10</text><text x="74" y="58" class="small">AsyncSqliteSaver checkpoint</text><text x="770" y="46" class="num">运行 10.844</text><text x="950" y="46" class="num">P95 10.814</text><text x="1115" y="46" class="num">CPU 11.922</text><text x="1282" y="46" class="num">RSS 169.3</text><text x="1438" y="46" class="num">写入 55.1</text></g>
    <g transform="translate(0 200)"><rect width="1472" height="76" rx="15" class="card"/><circle cx="34" cy="38" r="21" fill="#244c68"/><text x="34" y="46" class="rank">3</text><text x="74" y="34" class="label">OpenAI Agents + DBOS</text><text x="74" y="58" class="small">DBOS workflow / step + SQLite · 峰值 639 线程</text><text x="770" y="46" class="num">运行 38.844</text><text x="950" y="46" class="num">P95 38.059</text><text x="1115" y="46" class="num">CPU 42.062</text><text x="1282" y="46" class="num">RSS 220.0</text><text x="1438" y="46" class="num">写入 68.9</text></g>
    <g transform="translate(0 288)"><rect width="1472" height="76" rx="15" class="card"/><circle cx="34" cy="38" r="21" fill="#244c68"/><text x="34" y="46" class="rank">4</text><text x="74" y="34" class="label">Mastra 1.64.0 durable</text><text x="74" y="58" class="small">Durable Agent + LibSQL</text><text x="770" y="46" class="num">运行 22.699</text><text x="950" y="46" class="num">P95 22.453</text><text x="1115" y="46" class="num">CPU 23.266</text><text x="1282" y="46" class="num">RSS 628.1</text><text x="1438" y="46" class="num">写入 621.1</text></g>
  </g>
  <g transform="translate(64 730)">
    <text x="0" y="0" class="h">运行时赛道 · 1000 Agent 并发</text>
    <g transform="translate(0 24)"><rect width="1472" height="76" rx="15" class="winner"/><circle cx="34" cy="38" r="21" fill="#1a6c70"/><text x="34" y="46" class="rank">1</text><text x="74" y="34" class="label">Pygent 0.3.10 preferred</text><text x="74" y="58" class="small">1000/1000，通过精确工具计数</text><text x="770" y="46" class="num">运行 23.070</text><text x="950" y="46" class="num">P95 22.603</text><text x="1115" y="46" class="num">CPU 23.453</text><text x="1282" y="46" class="num">RSS 211.1</text><text x="1438" y="46" class="num">写入 718.8</text></g>
    <g transform="translate(0 112)"><rect width="1472" height="76" rx="15" class="card"/><circle cx="34" cy="38" r="21" fill="#244c68"/><text x="34" y="46" class="rank">2</text><text x="74" y="34" class="label">LangGraph 1.2.10 + SQLite</text><text x="74" y="58" class="small">1000/1000，通过精确工具计数</text><text x="770" y="46" class="num">运行 50.540</text><text x="950" y="46" class="num">P95 50.288</text><text x="1115" y="46" class="num">CPU 42.188</text><text x="1282" y="46" class="num">RSS 264.3</text><text x="1438" y="46" class="num">写入 280.0</text></g>
    <g transform="translate(0 200)"><rect width="1472" height="76" rx="15" class="card"/><circle cx="34" cy="38" r="21" fill="#244c68"/><text x="34" y="46" class="rank">3</text><text x="74" y="34" class="label">OpenAI Agents + DBOS</text><text x="74" y="58" class="small">1000/1000 · 峰值 2434 线程</text><text x="770" y="46" class="num">运行 86.767</text><text x="950" y="46" class="num">P95 84.909</text><text x="1115" y="46" class="num">CPU 84.719</text><text x="1282" y="46" class="num">RSS 374.5</text><text x="1438" y="46" class="num">写入 352.7</text></g>
    <g transform="translate(0 288)"><rect width="1472" height="76" rx="15" class="warn"/><text x="26" y="34" class="label">未入榜 · Mastra / Vercel WorkflowAgent</text><text x="26" y="59" class="small">Mastra：Node exit 13；Vercel Local World：越过 4 GB RSS guard。两者均未产生合格的 1000 并发结果。</text></g>
  </g>
  <g transform="translate(64 1125)">
    <text x="0" y="0" class="h">服务运行时赛道（HTTP + 生命周期 + 存储）</text>
    <g transform="translate(0 24)"><rect width="1472" height="76" rx="15" class="winner"/><text x="26" y="34" class="label">Agno AgentOS 3.0.6 · 唯一通过两档负载</text><text x="26" y="59" class="small">200 并发：11.041 s / RSS 254.3 MB　·　1000 并发：60.788 s / RSS 285.0 MB</text></g>
    <g transform="translate(0 112)"><rect width="1472" height="76" rx="15" class="warn"/><text x="26" y="34" class="label">AgentScope Runtime / Hayhooks · 未通过</text><text x="26" y="59" class="small">200 与 1000 并发均触发 180 秒请求 deadline；低 CPU 表明主要是排队/吞吐塌陷，不是 CPU 饱和。</text></g>
  </g>
  <g transform="translate(64 1350)">
    <rect width="1472" height="70" rx="16" fill="#0b2031" stroke="#244c68"/>
    <text x="24" y="29" class="small">循环赛道前三：Vercel AI SDK、Pi Agent Core、Pygent direct。它们的低开销不能代表 durable runtime 成本。</text>
    <text x="24" y="54" class="small">Pi Agent Core 和 raw OpenAI SDK 没有官方 runtime 可开；DBOS、Workflow Local World、AgentOS 等均已真实启动并计入进程树。</text>
  </g>
</svg>
