[project]
name = "lara"
version = "0.3.3"
description = "Local agent development and evaluation workbench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "lark-oapi>=1.7.5",
    "pygent-ai[video]==0.5.0",
    "python-dateutil>=2.9.0",
    "tzdata>=2025.2",
    "tzlocal>=5.2",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
credentials = [
    "keyring>=25.0.0",
]

[tool.uv.sources]
# 0.3.32 was tagged but never reached PyPI (ruff gate); 0.3.33 supersedes it
# and publishes from PyPI, so the temporary local-path override is gone.
# 0.3.34 sinks the lara runtime as pygent.lara and vendors the dynamic-memory
# CLI, so the memory-cli git dependency is no longer needed.

[project.scripts]
lara = "lara.cli:main"
lara-api = "lara_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lara", "src/lara_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
