[project]
name = "lara"
version = "0.3.3"
description = "Local agent development and evaluation workbench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dynamic-memory-cli",
    "fastapi>=0.115.0",
    "pygent-ai[video]==0.3.32",
    "python-dateutil>=2.9.0",
    "tzdata>=2025.2",
    "tzlocal>=5.2",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
credentials = [
    "keyring>=25.0.0",
]

[tool.uv.sources]
# The packaging lives on the codex/dynamic-memory-cli branch until it merges
# to main (or the package is published); uv.lock pins the resolved commit.
dynamic-memory-cli = { git = "ssh://git@github.com/pygent-ai/memory-cli", branch = "codex/dynamic-memory-cli" }
# 0.3.32 is not on PyPI yet; resolve from the local source repo so uv sync
# stops reverting the venv (which twice corrupted the package on the locked
# _native.pyd). Remove this override when 0.3.32 publishes.
pygent-ai = { path = "E:/Projects/pygent" }

[project.scripts]
lara = "lara.cli:main"
lara-api = "lara_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lara", "src/lara_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
