[project]
name = "lara"
version = "0.3.2"
description = "Local agent development and evaluation workbench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pygent-ai[video]==0.3.20",
    "python-dateutil>=2.9.0",
    "tzdata>=2025.2",
    "tzlocal>=5.2",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
credentials = [
    "keyring>=25.0.0",
]

[project.scripts]
lara = "lara.cli:main"
lara-api = "lara_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lara", "src/lara_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
